schema_version: 1

context:
  version: "0.12.1"
  # the XLA interface needs the headers shipped with jaxlib at build time;
  # jaxlib is not available on windows, ppc64le or for python <3.12
  build_xla: ${{ unix and not ppc64le and match(python, ">=3.12") }}

package:
  name: ale-py
  version: ${{ version }}

source:
  url: https://github.com/Farama-Foundation/Arcade-Learning-Environment/archive/refs/tags/v${{ version }}.tar.gz
  sha256: ade05f76416b4a49e8d6e5cc9bebb0745ae69f813aaeabe5813043f288db8ab3
  patches:
    - patches/0001-avoid-vcpkg-toolchain.patch
    - patches/0002-fix-installation-on-windows.patch
    - patches/0003-do-not-vendor-sdl2.patch
    - patches/0004-explain-missing-conda-roms.patch

build:
  number: 0
  script:
    file: build
    env:
      BUILD_VECTOR_XLA_LIB: ${{ "ON" if build_xla else "OFF" }}

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - nanobind
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    # for llvm-ar
    - if: osx
      then: llvm-tools
    - cmake
    - ninja
    - if: unix
      then: make
  host:
    - python
    - nanobind
    - pip
    - scikit-build-core
    - setuptools
    - libiconv
    - sdl2
    - zlib
    - libopencv
    - if: build_xla
      then: jax
  run:
    - python
    - py-opencv
    # not clear where these come from, but enforced by pip check
    - importlib-metadata
    - importlib-resources
    - typing-extensions
    - numpy

tests:
  - python:
      imports:
        - ale_py
      pip_check: true
  - if: build_xla
    then:
      script:
        - python -c "import ale_py._ale_py as m; assert hasattr(m, 'VectorXLAReset') and hasattr(m, 'VectorXLAStep')"

about:
  license: GPL-2.0-only
  license_file: LICENSE.md
  summary: The Arcade Learning Environment (ALE) -- a platform for AI research.
  description: |
    The Arcade Learning Environment (ALE) is a simple framework that allows
    researchers and hobbyists to develop AI agents for Atari 2600 games.

    A difference between the PyPI distribution of ale-py and the conda-forge package
    is that the conda-forge package was unable to verify the copyright status of the ROM
    required to use the library, and if conda-forge is allowed to redistribute them.
    For these reason, to actually work with the library, if you are legally allowed to
    access the ROMs, download them (for example with the https://github.com/Farama-Foundation/Arcade-Learning-Environment/blob/master/scripts/download_unpack_roms.sh
    script) and then set the `ALE_ROMS_DIR` environment variable to point to the directory that contains the ROMs.
  homepage: https://github.com/Farama-Foundation/Arcade-Learning-Environment
  repository: https://github.com/Farama-Foundation/Arcade-Learning-Environment

extra:
  recipe-maintainers:
    - h-vetinari
    - Tobias-Fischer
